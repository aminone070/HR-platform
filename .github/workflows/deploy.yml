name: Deploy

on:
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ── Staging (develop branch) ───────────────────────────────────────────────
  deploy-staging:
    name: Deploy – Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.hr-analytics.example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging..."
          # Uncomment and configure your deployment command:
          # aws s3 sync frontend/dist/ s3://${{ secrets.STAGING_BUCKET }}/ --delete
          # kubectl apply -f k8s/staging/

  # ── Production (main branch) ───────────────────────────────────────────────
  deploy-production:
    name: Deploy – Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://hr-analytics.example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Production
        run: |
          echo "Deploying to production..."
          # Uncomment and configure your deployment command:
          # aws s3 sync frontend/dist/ s3://${{ secrets.PROD_BUCKET }}/ --delete
          # kubectl apply -f k8s/production/

      - name: Create GitHub Deployment record
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Production deployment'
            })
