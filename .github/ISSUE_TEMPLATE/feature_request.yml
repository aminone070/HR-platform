name: Feature Request
description: Suggest an idea for this project
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a feature request! Please provide as much context as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what you want to achieve.
      placeholder: I would like the platform to be able to...
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use Case / Problem
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
