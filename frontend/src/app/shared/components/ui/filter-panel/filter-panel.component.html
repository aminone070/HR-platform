<div class="bg-surface-card rounded-lg shadow-md dark:shadow-lg p-6">
 <!-- Filter Panel Header -->
 <div class="flex items-center justify-between mb-6">
 <h3 class="text-lg font-semibold text-gray-900 ">Filters</h3>
 <div class="flex items-center gap-2">
 <button
 (click)="toggleAdvanced()"
 class="text-sm text-primary dark:text-primary-light hover:text-primary-dark dark:hover:text-indigo-300"
 [attr.aria-label]="showAdvanced() ? 'Hide advanced filters' : 'Show advanced filters'"
 >
 {{ showAdvanced() ? 'Hide' : 'Show' }} Advanced
 </button>
 <button
 (click)="resetFilters()"
 class="text-sm text-gray-600 hover:text-gray-900 "
 aria-label="Reset all filters"
 >
 Reset
 </button>
 </div>
 </div>

 <!-- Basic Filters -->
 <div class="space-y-4 mb-6">
 <!-- Department Filter -->
 <div>
 <label class="block text-sm font-medium text-gray-700 mb-2">
 Department
 </label>
 <select
 [(ngModel)]="selectedDepartments"
 (change)="onFilterChange()"
 multiple
 class="w-full px-3 py-2 border border-gray-300 rounded-md bg-surface-card text-gray-900 text-sm"
 aria-label="Filter by department"
 >
 <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
 </select>
 </div>

 <!-- Region Filter -->
 <div>
 <label class="block text-sm font-medium text-gray-700 mb-2">
 Region
 </label>
 <select
 [(ngModel)]="selectedRegions"
 (change)="onFilterChange()"
 multiple
 class="w-full px-3 py-2 border border-gray-300 rounded-md bg-surface-card text-gray-900 text-sm"
 aria-label="Filter by region"
 >
 <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
 </select>
 </div>
 </div>

 <!-- Advanced Filters Section -->
 <div *ngIf="showAdvanced()" class="border-t border-surface-border pt-6">
 <p class="text-sm text-gray-600 ">Advanced filtering options available</p>
 </div>
</div>
